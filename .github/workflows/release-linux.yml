# SPDX-License-Identifier: Apache-2.0
#
# Linux release binaries on every push to main, with their hashes, so the box can
# prove which build it is running: compare BUILD-INFO.txt before a restart with
# /health's `build` after.
name: release-linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release binaries
        env:
          # Read by `realorrug_types::build_sha_or_unknown`.
          REALORRUG_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p realorrug-analyst -p realorrug-serve -p realorrug-cli
      - name: Record what was built
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for b in realorrug-analyst realorrug-serve realorrug; do
              printf '%s  %s\n' "$(sha256sum "target/release/$b" | cut -d' ' -f1)" "$b"
            done
          } > target/release/BUILD-INFO.txt
          cat target/release/BUILD-INFO.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realorrug-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/realorrug-analyst
            target/release/realorrug-serve
            target/release/realorrug
            target/release/BUILD-INFO.txt
