[package]
name = "realorrug-payout"
description = "Claims the week's prize from the Pons fee escrow and pays it to the claimed address on Robinhood Chain, signed through Turnkey, under three refusals, and does nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
realorrug-contest.workspace = true
# Reads the chain: receipts, the escrow, the factory's launch record. It holds no
# key; the signing and sending live here.
realorrug-robinhood.workspace = true
# Recovering a signed transaction's sender, and stamping Turnkey requests.
k256.workspace = true
sha3.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# JSON-RPC and Turnkey's API. The same client the reader uses.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
# DER parsing for the stamp test only, so the hand-written encoder is checked by
# `k256`'s own decoder. Not in the payout binary.
k256 = { workspace = true, features = ["pkcs8"] }

[[bin]]
name = "realorrug-payout"
path = "src/main.rs"

[lib]
name = "realorrug_payout"
path = "src/lib.rs"

[lints]
workspace = true
