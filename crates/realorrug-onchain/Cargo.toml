# SPDX-License-Identifier: Apache-2.0
[package]
name = "realorrug-onchain"
description = "Reads a token's launch block and curve from RPC on demand, for a question asked about a mint that may be forty seconds old."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# The discriminator table and the argument decoders. Never a logged instruction
# name (LEARNINGS 3), and the token program varies by mint (ADR 0009).
realorrug-decode.workspace = true
# The curve, its fee schedule and the PDA derivations. Pure arithmetic: this
# crate supplies the bytes and that one says what they mean.
realorrug-pumpfun.workspace = true
realorrug-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# The read memory (design 0021 §4): one file, one writer, an index on the
# `(what, subject, block)` key for free, atomic commits that survive a crash
# mid-write. `bundled` compiles SQLite from source instead of linking a system
# library, which this box does not have and should not need to install.
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
