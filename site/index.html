<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real or Rug — checked, not predicted</title>
    <meta
      name="description"
      content="Real or Rug reads a Robinhood Chain token's launch and history right when you ask, and hands back what the chain shows. Checked, not predicted. Not financial advice."
    />
    <!--
      cabalhunter.org, not a Robinhood-Chain-named domain: the new domain is
      not bought yet, and which one to buy is the owner's decision, not one
      this rewrite makes for them. Canonical, og:url and og:image stay pointed
      here until the owner picks and buys one.
    -->
    <link rel="canonical" href="https://cabalhunter.org/" />
    <meta name="theme-color" content="#0c0a09" />

    <!--
      Open Graph and Twitter cards, and they are not optional here.

      This site's entire distribution is people sharing the bot's replies on X.
      A link that previews as a bare URL is a link nobody clicks, and the
      operator console has shipped without these since it was written because
      nobody was ever meant to share it.

      `summary_large_image` rather than `summary`: the card is the first thing
      anybody sees of this product.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Real or Rug" />
    <meta property="og:url" content="https://cabalhunter.org/" />
    <meta
      property="og:title"
      content="Real or Rug — checked, not predicted"
    />
    <meta
      property="og:description"
      content="Paste a Robinhood Chain contract address. Real or Rug reads the launch and the creator's history right then, and says what it found."
    />
    <meta property="og:image" content="https://cabalhunter.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Real or Rug: checked, not predicted."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Real or Rug — checked, not predicted" />
    <meta
      name="twitter:description"
      content="Paste a Robinhood Chain contract address. Real or Rug reads the launch and the creator's history right then, and says what it found."
    />
    <meta name="twitter:image" content="https://cabalhunter.org/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The page is a React application, so a reader with JavaScript off, or a
      scraper that does not run it, gets nothing from the div above. This is not
      a courtesy: link unfurlers and search crawlers are exactly the readers this
      product depends on, and telling them nothing while telling a browser
      everything is the kind of gap that goes unnoticed for months.

      Everything below is true, and it is checked against `Home.tsx` by
      `figures.test.ts` so the two cannot drift apart.
    -->
    <noscript>
      <h1>Real or Rug</h1>
      <!--
        No population figures here. The Solana/pump.fun launch-block numbers
        this block used to carry (528,871 launches, 2.87% graduate, and so on)
        were true about Solana and are not true about this product, which
        moved to Robinhood Chain -- see Home.tsx's module comment. Rather than
        relabel true-about-the-wrong-chain numbers as though they were
        Robinhood Chain figures, this block says only what is true regardless
        of which chain: what the account does and what it will not say.
      -->
      <p>
        Real or Rug checks a Robinhood Chain token before you buy. Paste a
        contract address and it reads the launch and the creator's history
        right then, and says what it found.
      </p>
      <p>
        It never states a price target, tells you to buy or sell, or calls a
        coin safe. Checked, not predicted. Not financial advice.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
